[package]
name = "crewreview-desktop"
# The app's version comes from apps/desktop/package.json, through tauri.conf.json.
version = "0.0.0"
description = "Crewreview desktop app: the crew in your menu bar or tray"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[[bin]]
name = "crewreview-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"

[dev-dependencies]
# The same verifier the updater plugin uses: proves our release key's signatures are accepted.
minisign-verify = "0.3"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
