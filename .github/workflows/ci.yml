name: CI

# Every pull request and every push to main: typecheck, tests, translations and changelog on the three systems,
# then a compiled binary that has to start.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 60000
      - run: bun run check:l10n
      - run: bun run check:changelog
      - run: bun run check:versions
      - name: Build and start the binary
        shell: bash
        run: |
          bun run build
          ./dist/crewreview-* --version

  desktop:
    name: Desktop app (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun apps/desktop/scripts/sidecar.ts
      - name: Lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      # The disk image the release ships, unsigned: its layout, background and contents.
      - name: App and disk image
        run: |
          set -euo pipefail
          (cd apps/desktop && bunx tauri build --target aarch64-apple-darwin --bundles app)
          bash apps/desktop/scripts/make-dmg.sh aarch64-apple-darwin

  # The release builds these packages for each system; this catches a packaging break before a tag does.
  linux-packages:
    name: Desktop packages (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf libarchive-tools
      - run: bun apps/desktop/scripts/sidecar.ts --target x86_64-unknown-linux-gnu
      - name: Build the AppImage, .deb and .rpm
        working-directory: apps/desktop
        run: bunx tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage --verbose --config "$(bun scripts/linux-config.ts x86_64-unknown-linux-gnu)"
      - name: The bundled CLI starts inside each package
        run: bash apps/desktop/scripts/check-linux.sh apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

  docker:
    name: Team machine image (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # With no VERSION it installs the latest published release, as a team machine does.
      - name: Build it from the latest release
        run: docker build -t crewreview:ci docker
      - name: It starts, and finds its agents
        run: |
          docker run --rm crewreview:ci --version
          docker run --rm crewreview:ci doctor | tee doctor.txt
          grep -E '^ +claude +installed' doctor.txt
          grep -E '^ +codex +installed' doctor.txt
