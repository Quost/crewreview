version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)", prefix-development: "chore(deps)" }
    # @types/bun follows the Bun the project runs (.bun-version), so both move together by hand.
    ignore:
      - dependency-name: "@types/bun"
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)" }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
