name: Release

# A tag vX.Y.Z builds the five CLI binaries, signs and notarizes the macOS ones (when MACOS_SIGNING is on), builds the
# desktop app on each system around those same binaries, writes and signs SHA256SUMS, signs the desktop update
# packages into latest.json, publishes a GitHub Release with the matching CHANGELOG section, and updates the Homebrew
# formula and the Scoop manifest on main. Tags with a dash (v0.2.0-beta.1) become pre-releases.
#
# macOS signing (CLI and desktop app) needs the repository variable MACOS_SIGNING=true and these secrets:
#   MACOS_CERT_P12       the "Developer ID Application" certificate with its key, exported as .p12, base64
#   MACOS_CERT_PASSWORD  the .p12 password
#   APPLE_ID             the Apple ID of the developer account
#   APPLE_APP_PASSWORD   an app-specific password for that Apple ID (appleid.apple.com)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Version matches the tag
        run: |
          for f in package.json apps/*/package.json packages/*/package.json plugins/crewreview/.claude-plugin/plugin.json; do
            v="$(bun -e "console.log(require('./$f').version)")"
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::$f is $v but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: bun run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/crewreview-*
          retention-days: 3

  macos-sign:
    needs: build
    if: vars.MACOS_SIGNING == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Sign and notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_ID APPLE_APP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::the $v secret is empty; set it again (see the top of this file)"; exit 1; }
          done
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/check.p12" || { echo "::error::MACOS_CERT_P12 isn't base64"; exit 1; }
          [ "$(wc -c < "$RUNNER_TEMP/check.p12")" -gt 1000 ] || { echo "::error::MACOS_CERT_P12 is too small to be a certificate"; exit 1; }
          rm -f "$RUNNER_TEMP/check.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass="$(openssl rand -base64 24)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          for f in dist/crewreview-darwin-*; do
            chmod +x "$f"
            codesign --force --options runtime --timestamp --entitlements packaging/macos/entitlements.plist \
              --sign "Developer ID Application: Matheus Quost (9527N6XKKW)" "$f"
            codesign --verify --strict --verbose=1 "$f"
            "$f" --version
            ditto -c -k --keepParent "$f" "$f.zip"
            xcrun notarytool submit "$f.zip" --apple-id "$APPLE_ID" --team-id 9527N6XKKW --password "$APPLE_APP_PASSWORD" --wait
            rm "$f.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/crewreview-darwin-*
          retention-days: 3

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The disk image comes from apps/desktop/scripts/make-dmg.sh, after the build: Tauri's skips its layout on CI.
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, cli: crewreview-darwin-arm64, bundles: app }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, cli: crewreview-darwin-x64, bundles: app }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, cli: crewreview-windows-x64.exe, bundles: nsis }
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, cli: crewreview-linux-x64, bundles: "deb,rpm,appimage" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, cli: crewreview-linux-arm64, bundles: "deb,rpm,appimage" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf libarchive-tools
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The app carries the same CLI binary as the release, not a second build of it.
      - run: bun apps/desktop/scripts/sidecar.ts --target ${{ matrix.target }} --from dist/${{ matrix.cli }}
      - name: Build (signed and notarized on macOS)
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # Not SIGN: linuxdeploy signs the AppImage with GPG whenever a variable of that name exists.
          MACOS_SIGN: ${{ runner.os == 'macOS' && vars.MACOS_SIGNING == 'true' }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.MACOS_CERT_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$MACOS_SIGN" = true ]; then
            export APPLE_SIGNING_IDENTITY="Developer ID Application: Matheus Quost (9527N6XKKW)" APPLE_TEAM_ID=9527N6XKKW
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD
          fi
          cd apps/desktop
          extra=()
          # linuxdeploy hides its errors unless the build is verbose.
          case "$TARGET" in *linux*) extra=(--verbose --config "$(bun scripts/linux-config.ts "$TARGET")");; esac
          bunx tauri build --target "$TARGET" --bundles "$BUNDLES" ${extra[@]+"${extra[@]}"}
      - name: Disk image, signed and notarized
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          MACOS_SIGN: ${{ vars.MACOS_SIGNING == 'true' }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Tauri signed and notarized the app with a keychain it has removed since: the image gets its own.
          if [ "$MACOS_SIGN" = true ]; then
            keychain="$RUNNER_TEMP/dmg.keychain-db"
            kpass="$(openssl rand -base64 24)"
            printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dmg.p12"
            security create-keychain -p "$kpass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$kpass" "$keychain"
            security import "$RUNNER_TEMP/dmg.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/dmg.p12"
            export APPLE_SIGNING_IDENTITY="Developer ID Application: Matheus Quost (9527N6XKKW)"
          fi
          dmg="$(bash apps/desktop/scripts/make-dmg.sh "$TARGET" | tail -1)"
          # Gatekeeper checks the image a browser downloaded too, so it gets its own ticket.
          if [ "$MACOS_SIGN" = true ]; then
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id 9527N6XKKW --password "$APPLE_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          fi
      - name: The bundled CLI starts inside the app
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          b="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$b/macos/Crewreview.app"
          codesign --verify --deep --strict --verbose=1 "$app"
          codesign -d --entitlements - "$app/Contents/MacOS/crewreview" 2>/dev/null | grep -q allow-jit
          "$app/Contents/MacOS/crewreview" --version
          if [ "${{ vars.MACOS_SIGNING }}" = true ]; then
            spctl -a -vv "$app"
            spctl -a -t open --context context:primary-signature -vv "$b"/dmg/*.dmg
          fi
      - name: The bundled CLI starts inside the Linux packages
        if: runner.os == 'Linux'
        run: bash apps/desktop/scripts/check-linux.sh apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Collect the installers under stable names
        run: |
          set -euo pipefail
          b="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          n="Crewreview-${{ matrix.name }}"
          mkdir -p out
          case "${{ matrix.target }}" in
            *apple-darwin)
              tar -czf "out/$n.app.tar.gz" -C "$b/macos" Crewreview.app
              cp "$b"/dmg/*.dmg "out/$n.dmg" ;;
            *windows*)
              cp "$b"/nsis/*-setup.exe "out/$n-setup.exe" ;;
            *linux*)
              cp "$b"/appimage/*.AppImage "out/$n.AppImage"
              cp "$b"/deb/*.deb "out/$n.deb"
              cp "$b"/rpm/*.rpm "out/$n.rpm" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*
          retention-days: 3

  publish:
    needs: [build, macos-sign, desktop]
    if: always() && needs.build.result == 'success' && needs.desktop.result == 'success' && (needs.macos-sign.result == 'success' || needs.macos-sign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Signed macOS binaries replace the unsigned ones
        if: needs.macos-sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist
      - name: Desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - run: bun scripts/checksums.ts dist
      # Updates install only binaries whose SHA256SUMS carries this signature.
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bun scripts/release-key.ts sign dist/SHA256SUMS
      - name: Notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          # A pre-release (v0.2.0-rc.1) without its own section shows what's under Unreleased.
          if [ ! -s notes.md ] && [ "${v#*-}" != "$v" ]; then
            awk '/^## Unreleased/ {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          fi
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      # The desktop app installs an update only with this signature, and only for the version it names.
      - name: Sign the desktop update packages into latest.json
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          for f in dist/*.app.tar.gz dist/*-setup.exe dist/*.AppImage; do bun scripts/release-key.ts sign "$f"; done
          bun scripts/updater-manifest.ts "${GITHUB_REF_NAME#v}" dist notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Crewreview ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
      - name: Update the Homebrew formula and the Scoop manifest
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          # Deploy key with write access to this repository only. main is protected (pull request, checks,
          # signatures) and only deploy keys may bypass that, so the bot pushes with it when it is set.
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp dist/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"
          git checkout main
          git pull --no-rebase origin main
          bun scripts/package-manifests.ts "$v" "$RUNNER_TEMP/SHA256SUMS"
          git add Formula bucket
          if git diff --cached --quiet; then exit 0; fi
          bot="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): update package manifests to $v" -m "Signed-off-by: $bot"
          if [ -n "$DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/deploy_key"; (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key")
            GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              git push "git@github.com:$GITHUB_REPOSITORY.git" HEAD:main
            rm -f "$key"
          else
            git push origin main
          fi

  # The site names the version: redeploy it once the release is out.
  site:
    needs: publish
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      id-token: write
