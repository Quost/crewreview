name: Site

# Builds site/ and deploys it to Firebase Hosting (https://crewreview.pururucos.com.br), then pings IndexNow.
# Runs on every push to main that touches the site or the version, by hand, and after each release (release.yml
# calls it, because a release made with GITHUB_TOKEN doesn't trigger other workflows).
#
# Keyless: GitHub's OIDC token is exchanged for a short-lived Google credential (Workload Identity Federation).
# Only this repository may impersonate the service account, which can only deploy Firebase Hosting.
# Repo variables: WIF_PROVIDER, WIF_SERVICE_ACCOUNT.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.ts"
      - "scripts/lib/family.ts"
      - "package.json"
      - "firebase.json"
      - ".firebaserc"
      - "hosting-redirect/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      # The predeploy step in firebase.json builds the site (bun scripts/build-site.ts).
      - name: Deploy the site and the redirects from the old addresses
        run: >
          npx --yes firebase-tools@15.37.0 deploy --non-interactive --project crewreview-prd
          --only hosting:crewreview,hosting:crewreview-legacy,hosting:crewreview-legacy-prd
      - name: Tell search engines (IndexNow)
        run: bun scripts/indexnow.ts || true
