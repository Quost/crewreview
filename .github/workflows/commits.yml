name: Commits

# Conventional Commits with a DCO sign-off on every commit. Pull requests are squashed, so the title is checked too.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          npm install --no-save --silent @commitlint/cli@19 @commitlint/config-conventional@19
          if [ "$EVENT" = pull_request ]; then FROM="$PR_BASE"; TO="$PR_HEAD"; else FROM="$PUSH_BEFORE"; TO="$PUSH_SHA"; fi
          # First push of a branch: there is no "before", so check the last commit only.
          if [ -z "$FROM" ] || [ "$FROM" = 0000000000000000000000000000000000000000 ]; then FROM="$TO~1"; fi
          if ! git rev-parse --verify --quiet "$FROM" >/dev/null; then FROM="$(git rev-list --max-parents=0 "$TO")"; fi
          npx --no-install commitlint --from "$FROM" --to "$TO" --verbose

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save --silent @commitlint/cli@19 @commitlint/config-conventional@19
          printf '%s\n\nSigned-off-by: title check <noreply@example.com>\n' "$TITLE" | npx --no-install commitlint --verbose
