name: Release

# A tag vX.Y.Z builds the five binaries on one machine, writes SHA256SUMS and publishes a GitHub Release with the
# matching CHANGELOG section as notes. Tags with a dash (v0.1.0-beta.1) become pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Version matches the tag
        run: |
          v="$(bun -e 'console.log(require("./package.json").version)')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::package.json is $v but the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: bun run build:all
      - name: Notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Crewreview ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
